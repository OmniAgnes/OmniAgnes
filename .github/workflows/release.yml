# 发版（打 tag 自动出 Windows / macOS / Linux 安装包并挂到 Release）
#
# 项目结构：Go 单体（omni --web 内核，前端经 go:embed 打进二进制）+ Electron 壳（webui/desktop）。
# 依赖管理用 npm（package-lock.json）；内核是 Go 交叉编译产物（GOOS/GOARCH），
# 不是 npm 平台包，不需要 postinstall / npm pack / beforePack 换内核那一整套。
#
# 用法：
#   1. 改 webui/desktop/package.json 的 version（如 0.3.0）——必须先改再打 tag，
#      安装包名里的版本号（CI 注入）与包内 package.json 要对得上。
#      ⚠️ 这是全仓库唯一的版本号来源：界面「版本号」由内核从本文件读出
#      （main.go 的 go:embed + internal/webui 的 /api/state），没有第二处常量要同步。
#   2. git commit && git push
#   3. git tag -a v0.3.0 -m "release v0.3.0" && git push origin v0.3.0
#      → 本工作流自动跑：Windows / macOS / Linux 上分别构建安装包，上传到对应 Release 的附件。
#
# ⚠️ 附件文件名固定、不带版本号（QingNiao-Setup.exe 同款规则）：
#   应用内「一键下载」类直链是
#     https://github.com/<owner>/<repo>/releases/latest/download/<固定名>
#   这条路不经过 api.github.com，是国内能直连的下载方式；代价是每次发版覆盖同名附件，
#   历史版本靠 git tag 与各自的 Release 页面追溯。
#   ⚠️ 名字一律用英文 `omni`：GitHub 附件名与 releases/latest/download/<名> 直链对
#   非 ASCII 字符要 URL 转义，中文名在下载端表现不稳。
#
# 三个平台的附件名（由 electron-builder.yml 的 artifactName 决定，改一处即可）：
#   · Windows：omni-Setup.exe（x64，固定名维持直链）+ omni-Setup-arm64.exe（ARM64）
#   · macOS  ：omni-Setup-arm64.dmg + omni-Setup-x64.dmg（未签名，见 build-mac 注释）
#   · Linux  ：omni-Setup-x86_64.AppImage + omni-Setup-arm64.AppImage（主推，免安装）
#              omni-Setup-amd64.deb + omni-Setup-arm64.deb（apt/软件中心）
#              ⚠️ x64 架构在两种格式下的文件名不同（x86_64 vs amd64），见 build-linux 的注释
#
# ⚠️ 打包已验证的经验（别改回去）：
#   1) electron-builder.yml 的 `publish: null` 是必需的。不写它时 electron-builder 会从
#      package.json 的 repository 推断 provider=github，写 app-update.yml 时构造
#      GitHubPublisher → 没 GH_TOKEN 直接抛错，且 `--publish never` 拦不住该步骤。
#      也不能写 `publish: generic`（会强制校验 url，换一个错继续抛）。
#   2) 不要在 electron-builder.yml 里写 `extraMetadata: { version: "${version}" }`——
#      该字段不展开占位符，会被原样写进 app 的 package.json，最后写 exe 资源版本号时
#      抛「Invalid major number in: ${version}」。
#   3) 上传步骤 `fail_on_unmatched_files: true` 是护栏，但要求 files 里只列
#      **确定会产出的文件**。本项目 publish: null → 不生成 latest.yml，所以不列它。

name: release

on:
  push:
    tags:
      - 'v*'
  # 允许手动跑一次（补传、或某个 tag 的构建失败了要重跑）
  workflow_dispatch:
    inputs:
      tag:
        description: '要补建的 tag（如 v0.2.0）'
        required: true

# 上传附件到 Release 需要写权限（默认 token 只有读权限）
permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # Windows：主发版线。这个 job 失败就是发版失败。
  # ---------------------------------------------------------------------------
  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # ⚠️ 版本一致性护栏（2026-10-15 加，防再发「壳旧内核新」的错位包）：
      #    壳版本由 electron-builder 读本目录 package.json；内核版本由 -X main.version=${TAG}
      #    注入（TAG=tag 名）。两者一旦不同，就会产出一个「关于页显示新版本、升级弹窗却现旧版本」
      #    的坏包——GitHub 同名附件被先跑的坏 run 覆盖后，latest/download 一直给坏包。
      #    打包前先断言 package.json 版本 == 当前 tag，不一致立即 fail，绝不放行。
      - name: 校验 package.json 版本与 tag 一致
        shell: bash
        run: |
          set -e
          TAG="${GITHUB_REF_NAME:-${{ github.event.inputs.tag }}}"
          PKG_VER=$(node -p "require('./webui/desktop/package.json').version")
          [ -z "$TAG" ] && { echo "::error::TAG 为空，无法校验版本一致性"; exit 1; }
          if [ "$TAG" != "$PKG_VER" ] && [ "$TAG" != "v$PKG_VER" ]; then
            echo "::error::package.json 版本($PKG_VER)与 tag($TAG)不一致 —— 会打出壳旧内核新的错位包，已终止。请先用 npm version 把 package.json 升到 $TAG 再发版。"
            exit 1
          fi
          echo "  ✓ tag/package.json 版本一致：$TAG"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            webui/frontend/package-lock.json
            webui/desktop/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 构建前端（→ internal/webui/dist，go:embed 消费）
        run: |
          npm ci
          npm run build
        working-directory: webui/frontend

      # Electron 二进制体积大（~100MB），npm install 阶段的 postinstall 负责下载它，
      # 镜像变量必须挂在**安装步骤**而不是构建步骤上才生效。
      - name: 安装桌面端依赖
        run: npm ci
        working-directory: webui/desktop
        env:
          ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/

      # 单条 go build 只出一个二进制；这里为每个目标架构各跑一次。
      # ⚠️ 两个架构都编成「备料名」，再把本机架构那份拷成正式名 bin/omni.exe：
      #    beforePack 钩子按目标架构**无条件**从备料覆盖正式名（实测教训：
      #    若本机架构轮没有备料、靠短路沿用正式名，双架构轮次先后顺序一变，
      #    交叉轮先跑就会把错架构内核留进本机轮的安装包——顺序相关、必炸）。
      # 版本号注入（-X main.version）让 omni.exe --version 与安装包版本一致。
      - name: 交叉编译 omni 内核（windows amd64/arm64）
        shell: bash
        run: |
          set -e
          TAG="${GITHUB_REF_NAME:-${{ github.event.inputs.tag }}}"
          LDFLAGS="-s -w -X main.version=${TAG}"
          # 内置技能（.omni/skills）同步进 go:embed 源，编进内核二进制
          go run ./build/gen-builtin-skills
          mkdir -p webui/desktop/bin
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "$LDFLAGS" -o webui/desktop/bin/omni-windows-x64.exe .
          GOOS=windows GOARCH=arm64 go build -trimpath -ldflags "$LDFLAGS" -o webui/desktop/bin/omni-windows-arm64.exe .
          # 内置 MCP 插件（dev/ 下的服务器）同样按目标架构编进备料目录，
          # beforePack 钩子按架构换入 bin/，随 extraResources 进包（见 electron-before-pack.cjs）
          for ARCH in x64 arm64; do
            GA=$ARCH; [ "$ARCH" = x64 ] && GA=amd64
            for P in pdf xlsx docx pptx csv image media fetch agnes mimo; do
              GOOS=windows GOARCH=$GA go build -trimpath -o "webui/desktop/bin/mcp-windows-$ARCH/$P.exe" "./dev/$P"
            done
          done
          # runner 是 x64：正式名先放 x64 那份（钩子会按每轮目标架构无条件从备料重覆盖）
          cp webui/desktop/bin/omni-windows-x64.exe webui/desktop/bin/omni.exe
          ls -l webui/desktop/bin

      # 内置 ffmpeg / ffprobe（media MCP 插件的运行时依赖，Electron 自带的 ffmpeg.dll
      # 是 Chromium 裁剪版：只能解码、无编码器、不可命令行调用）。按目标架构备料，
      # beforePack 钩子换入 bin/ 正式名后随 extraResources 进包。来源与覆盖方式见脚本头注释。
      - name: 拉取内置 ffmpeg/ffprobe（windows x64/arm64）
        shell: bash
        run: |
          set -e
          for ARCH in x64 arm64; do
            node webui/desktop/scripts/fetch-ffmpeg.mjs --platform win32 --arch "$ARCH"
          done

      # ⚠️ 打包前先用 electron-builder 自带 schema 校验 electron-builder.yml。
      #    非法字段（如 linux.desktop 下平铺一个键）会让 electron-builder 起步就抛
      #    "Invalid configuration object" 并浪费一整轮交叉编译；提前校验是秒级失败。
      - name: 校验 electron-builder.yml 配置
        run: npm run check:config
        working-directory: webui/desktop

      # dist 脚本里已串 check-bin + --publish never；这里再显式传一遍发布参数。
      # --x64 --arm64：一次出双架构包（两个 flag 都要写——只传一个就只出那一个架构）。
      # 产物：omni-Setup-x64.exe + omni-Setup-arm64.exe（artifactName 带 ${arch}），
      # arm64 包的内核由 beforePack 钩子从 omni-windows-arm64.exe 换入。
      - name: 构建 Windows 安装包（x64 + arm64）
        run: npx electron-builder --win --x64 --arm64 --publish never
        working-directory: webui/desktop
        env:
          # electron 二进制体积大（~100MB），走官方 GitHub Release 直连
          ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/eb-cache

      # ⚠️ 打包后的产物校验，不能省：
      #   1) 两个架构的安装包都必须产出（没产出会在上传步骤炸或静默漏传）；
      #   2) 包内内核必须是真二进制且架构与包一致——读 PE 头 machine 字段断言
      #      （0x8664=x64、0xaa64=arm64），防止「交叉轮没换内核」的包混上 Release。
      #   注：x64 的 unpacked 目录叫 win-unpacked（默认架构无后缀），arm64 叫 win-arm64-unpacked。
      - name: 校验双架构安装包与内核
        shell: bash
        run: |
          for ARCH in x64 arm64; do
            if [ "$ARCH" = x64 ]; then APPDIR="webui/desktop/release/win-unpacked"; else APPDIR="webui/desktop/release/win-$ARCH-unpacked"; fi
            if [ ! -d "$APPDIR" ]; then
              echo "::error::未产出 $APPDIR——检查 electron-builder.yml 的 win 配置与 --x64 --arm64 参数"
              ls -l webui/desktop/release
              exit 1
            fi
            BIN="$APPDIR/resources/bin/omni.exe"
            if [ ! -f "$BIN" ]; then
              echo "::error::[$ARCH] 安装包内缺少内核二进制：$BIN"
              exit 1
            fi
            # 内置 MCP 插件必须随包（内核按自身同目录自动注册）
            for P in pdf xlsx docx pptx csv image media fetch agnes mimo; do
              if [ ! -f "$APPDIR/resources/bin/$P.exe" ]; then
                echo "::error::[$ARCH] 安装包内缺少 MCP 插件：$APPDIR/resources/bin/$P.exe"
                exit 1
              fi
            done
            # ffmpeg/ffprobe 必须随包（media 插件的运行时依赖；放 bin/ffmpeg/ 子目录
            # 是为了避开内核「扫描目录内可执行文件自动注册为 MCP 插件」的逻辑）
            for T in ffmpeg ffprobe; do
              if [ ! -f "$APPDIR/resources/bin/ffmpeg/$T.exe" ]; then
                echo "::error::[$ARCH] 安装包内缺少 ffmpeg/$T.exe（media 插件将不可用）"
                exit 1
              fi
            done
            SIZE=$(stat -c%s "$BIN")
            echo "[$ARCH] 内核二进制：$BIN（$SIZE 字节，预期 >10MB）"
            if [ "$SIZE" -lt 10000000 ]; then
              echo "::error::[$ARCH] 只有 $SIZE 字节，疑似占位/未编译产物"
              exit 1
            fi
            KIND=$(node -p "const fs=require('fs');const b=Buffer.alloc(4096);const f=fs.openSync(process.argv[1],'r');fs.readSync(f,b,0,4096,0);fs.closeSync(f);'0x'+b.readUInt16LE(b.readUInt32LE(0x3c)+4).toString(16)" "$BIN")
            echo "[$ARCH] 内核 PE machine：$KIND"
            case "$ARCH" in
              x64)   if [ "$KIND" != "0x8664" ]; then echo "::error::[$ARCH] 包里的内核不是 x64（$KIND）——beforePack 钩子未生效"; exit 1; fi ;;
              arm64) if [ "$KIND" != "0xaa64" ]; then echo "::error::[$ARCH] 包里的内核不是 arm64（$KIND）——内核没编出来或钩子未生效"; exit 1; fi ;;
            esac
          done
          echo "✓ 双架构安装包与内核均正常"

      # artifactName 带 ${arch} 后 x64 产物叫 omni-Setup-x64.exe；应用内下载承诺的固定直链是
      # releases/latest/download/omni-Setup.exe。把 x64 包重命名上传，直链不中断（历史版本靠 tag 追溯）。
      - name: 重命名 x64 包为固定名（维持更新直链）
        shell: bash
        run: |
          set -e
          ls -l webui/desktop/release/*.exe
          for f in webui/desktop/release/omni-Setup-x64.exe webui/desktop/release/omni-Setup-arm64.exe; do
            if [ ! -f "$f" ]; then
              echo "::error::未找到 $f——检查 electron-builder.yml 的 win.artifactName 是否带 \${arch}"
              exit 1
            fi
          done
          mv webui/desktop/release/omni-Setup-x64.exe webui/desktop/release/omni-Setup.exe
          echo "✓ x64 包已重命名为 omni-Setup.exe"

      - name: 上传 Windows 安装包到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            webui/desktop/release/omni-Setup.exe
            webui/desktop/release/omni-Setup-arm64.exe
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          # 没有手写说明时自动用提交信息生成；有 Release 说明就先建好 Release 再跑本流程
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 构建日志里留一份产物清单：发版后想确认"到底传上去了什么"时不用翻 UI
      - name: 列出产物
        shell: bash
        run: ls -l webui/desktop/release

  # ---------------------------------------------------------------------------
  # macOS：与 Windows 并行构建，产物是各架构的 dmg。
  #
  # ⚠️ `continue-on-error: true` 是刻意的：
  #   没有 Apple Developer 账号，dmg 出的是**未签名**包（用户首次打开需右键→打开
  #   绕过 Gatekeeper），且 mac 构建更容易受 runner 环境波动影响。
  #   发版主体是 Windows 包（国内用户为主），不该让 mac 的失败把整个 Release 拦下。
  #   想收紧时删掉这一行即可（那样 mac 构建失败 = 发版失败）。
  # ---------------------------------------------------------------------------
  build-mac:
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      # 版本一致性护栏：package.json 版本必须等于当前 tag，否则会打出「壳旧内核新」的错位包（见 build-win 同名步骤注释）
      - name: 校验 package.json 版本与 tag 一致
        shell: bash
        run: |
          set -e
          TAG="${GITHUB_REF_NAME:-${{ github.event.inputs.tag }}}"
          PKG_VER=$(node -p "require('./webui/desktop/package.json').version")
          [ -z "$TAG" ] && { echo "::error::TAG 为空，无法校验版本一致性"; exit 1; }
          if [ "$TAG" != "$PKG_VER" ] && [ "$TAG" != "v$PKG_VER" ]; then
            echo "::error::package.json 版本($PKG_VER)与 tag($TAG)不一致 —— 会打出壳旧内核新的错位包，已终止。请先用 npm version 把 package.json 升到 $TAG 再发版。"
            exit 1
          fi
          echo "  ✓ tag/package.json 版本一致：$TAG"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            webui/frontend/package-lock.json
            webui/desktop/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 构建前端（→ internal/webui/dist，go:embed 消费）
        run: |
          npm ci
          npm run build
        working-directory: webui/frontend

      - name: 安装桌面端依赖
        run: npm ci
        working-directory: webui/desktop
        env:
          ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/

      - name: 交叉编译 omni 内核（darwin arm64/amd64）
        shell: bash
        run: |
          set -e
          TAG="${GITHUB_REF_NAME:-${{ github.event.inputs.tag }}}"
          LDFLAGS="-s -w -X main.version=${TAG}"
          # 内置技能（.omni/skills）同步进 go:embed 源，编进内核二进制
          go run ./build/gen-builtin-skills
          mkdir -p webui/desktop/bin
          GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags "$LDFLAGS" -o webui/desktop/bin/omni-darwin-arm64 .
          GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags "$LDFLAGS" -o webui/desktop/bin/omni-darwin-x64 .
          # 内置 MCP 插件按目标架构编进备料目录，beforePack 钩子换入 bin/（同内核套路）
          for ARCH in arm64 x64; do
            GA=$ARCH; [ "$ARCH" = x64 ] && GA=amd64
            for P in pdf xlsx docx pptx csv image media fetch agnes mimo; do
              mkdir -p "webui/desktop/bin/mcp-darwin-$ARCH"
              GOOS=darwin GOARCH=$GA go build -trimpath -o "webui/desktop/bin/mcp-darwin-$ARCH/$P" "./dev/$P"
            done
          done
          # runner（macos-latest）是 Apple Silicon：正式名先放 arm64 那份（钩子按轮次无条件重覆盖）
          cp webui/desktop/bin/omni-darwin-arm64 webui/desktop/bin/omni
          chmod +x webui/desktop/bin/omni webui/desktop/bin/omni-darwin-*
          ls -l webui/desktop/bin

      # 内置 ffmpeg / ffprobe（media 插件依赖；Electron 的 ffmpeg.dll 不能用于转码）
      # 备料落在 bin/ffmpeg/ 子目录（放 bin/ 根目录会被内核扫成幻影 MCP 插件）。
      # 这里显式校验而不是 `chmod +x <glob>`：glob 无匹配时 chmod 会报
      # "cannot access"，看起来像拉取失败，实际只是路径写错（v1.0.24 首跑踩过）。
      - name: 拉取内置 ffmpeg/ffprobe（darwin arm64/x64）
        shell: bash
        run: |
          set -e
          for ARCH in arm64 x64; do
            node webui/desktop/scripts/fetch-ffmpeg.mjs --platform darwin --arch "$ARCH"
          done
          for F in webui/desktop/bin/ffmpeg/ffmpeg-darwin-* webui/desktop/bin/ffmpeg/ffprobe-darwin-*; do
            [ -f "$F" ] || { echo "::error::缺少备料 $F（fetch-ffmpeg 拉取未成功？）"; exit 1; }
            chmod +x "$F"
          done

      # icon.icns 不入库（二进制产物），CI 上从已入库的 build/icon.png 现场生成
      # （icon.png 由 make_icon.py 从 icon.svg 渲染）。
      - name: 生成 macOS 图标 icon.icns
        shell: bash
        run: |
          set -e
          cd webui/desktop
          mkdir -p build/icon.iconset
          for S in 16 32 128 256 512; do
            sips -z $S $S build/icon.png --out build/icon.iconset/icon_${S}x${S}.png >/dev/null
            D=$((S*2))
            sips -z $D $D build/icon.png --out build/icon.iconset/icon_${S}x${S}@2x.png >/dev/null
          done
          iconutil -c icns build/icon.iconset -o build/icon.icns
          ls -l build/icon.icns

      # 打包前 schema 校验（理由同 Windows job：非法配置要秒级失败，别浪费交叉编译）
      - name: 校验 electron-builder.yml 配置
        run: npm run check:config
        working-directory: webui/desktop

      # dist:mac 已串 check-bin。这里额外关掉签名自动发现，
      # 否则没有钥匙串证书时 electron-builder 会要求签名而失败。
      # --arm64 --x64：一次出双架构包（mac.artifactName 带 ${arch}，互不覆盖）。
      # 产物：omni-Setup-arm64.dmg + omni-Setup-x64.dmg（不出 zip：它是
      # electron-updater 的 mac 自动更新格式，本项目不用）。
      # x64 包的内核由 beforePack 钩子从 omni-darwin-x64 换入（上一步编好）。
      - name: 构建 macOS 安装包（未签名，arm64 + x64）
        run: npx electron-builder --mac --arm64 --x64 --publish never
        working-directory: webui/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/eb-cache

      # ⚠️ mac 专属断言，Windows 上测不出来（Windows 不看可执行位）：
      #   打包进 app 的内核必须带 x 位，否则主进程 spawn 它会被系统拒绝。
      #   同时验架构没打岔（file 输出含 cputype）：防止「arm64 机器上打 x64 包
      #   却忘了换内核」——Mach-O 文件头两种架构相同，只有 cputype 能区分。
      #   unpacked 目录名规则：默认架构 x64 → release/mac，arm64 → release/mac-arm64。
      - name: 校验双架构内核已打进安装包且架构正确
        shell: bash
        run: |
          for ARCH in arm64 x64; do
            case "$ARCH" in
              arm64) APPDIR="webui/desktop/release/mac-arm64" ;;
              x64)   APPDIR="webui/desktop/release/mac" ;;
            esac
            if [ ! -d "$APPDIR" ]; then
              echo "::error::未产出 $APPDIR"
              ls -l webui/desktop/release
              exit 1
            fi
            BIN=$(find "$APPDIR" -path '*/Contents/Resources/bin/omni' -type f 2>/dev/null | head -1)
            if [ -z "$BIN" ]; then
              echo "::error::[$ARCH] .app 包内找不到内核二进制（Contents/Resources/bin/omni）"
              echo "::error::检查 electron-builder.yml 的 extraResources 与 beforePack 钩子"
              exit 1
            fi
            SIZE=$(stat -f%z "$BIN")
            echo "[$ARCH] 内核二进制：$BIN（$SIZE 字节，预期 >10MB）"
            if [ "$SIZE" -lt 10000000 ]; then
              echo "::error::[$ARCH] 只有 $SIZE 字节，疑似未编译产物"
              exit 1
            fi
            KIND=$(file -b "$BIN")
            echo "  类型：$KIND"
            case "$ARCH" in
              arm64) case "$KIND" in *arm64*) echo "  ✓ 架构匹配" ;; *) echo "::error::[$ARCH] 包里装的不是 arm64 内核（$KIND）"; exit 1 ;; esac ;;
              x64)   case "$KIND" in *x86_64*) echo "  ✓ 架构匹配" ;; *) echo "::error::[$ARCH] 包里装的不是 x64 内核（$KIND）——beforePack 钩子未生效"; exit 1 ;; esac ;;
            esac
            if [ ! -x "$BIN" ]; then
              echo "::error::[$ARCH] 内核二进制没有可执行权限——mac 上主进程无法 spawn 它"
              echo "::error::该文件权限：$(ls -l "$BIN")"
              exit 1
            fi
            # 内置 MCP 插件必须随包且带 x 位
            RESDIR=$(dirname "$BIN")
            for P in pdf xlsx docx pptx csv image media fetch agnes mimo; do
              if [ ! -x "$RESDIR/$P" ]; then
                echo "::error::[$ARCH] 安装包内缺少 MCP 插件（或无 x 位）：$RESDIR/$P"
                exit 1
              fi
            done
            # ffmpeg/ffprobe 必须随包且带 x 位（media 插件依赖，位于 bin/ffmpeg/ 子目录）
            for T in ffmpeg ffprobe; do
              if [ ! -x "$RESDIR/ffmpeg/$T" ]; then
                echo "::error::[$ARCH] 安装包内缺少 ffmpeg/$T（或无 x 位），media 插件将不可用"
                exit 1
              fi
            done
          done
          echo "✓ 双架构内核均正常且可执行"

      - name: 列出产物
        shell: bash
        run: ls -l webui/desktop/release

      - name: 上传 macOS 安装包到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            webui/desktop/release/omni-Setup-arm64.dmg
            webui/desktop/release/omni-Setup-x64.dmg
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # Linux：出 AppImage（主推，免安装单文件）+ deb（apt / 软件中心）。
  # 同样 continue-on-error: true——发版主体是 Windows，Linux 构建不该拖垮整个 Release。
  # ---------------------------------------------------------------------------
  build-linux:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      # 版本一致性护栏：package.json 版本必须等于当前 tag，否则会打出「壳旧内核新」的错位包（见 build-win 同名步骤注释）
      - name: 校验 package.json 版本与 tag 一致
        shell: bash
        run: |
          set -e
          TAG="${GITHUB_REF_NAME:-${{ github.event.inputs.tag }}}"
          PKG_VER=$(node -p "require('./webui/desktop/package.json').version")
          [ -z "$TAG" ] && { echo "::error::TAG 为空，无法校验版本一致性"; exit 1; }
          if [ "$TAG" != "$PKG_VER" ] && [ "$TAG" != "v$PKG_VER" ]; then
            echo "::error::package.json 版本($PKG_VER)与 tag($TAG)不一致 —— 会打出壳旧内核新的错位包，已终止。请先用 npm version 把 package.json 升到 $TAG 再发版。"
            exit 1
          fi
          echo "  ✓ tag/package.json 版本一致：$TAG"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            webui/frontend/package-lock.json
            webui/desktop/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 构建前端（→ internal/webui/dist，go:embed 消费）
        run: |
          npm ci
          npm run build
        working-directory: webui/frontend

      - name: 安装桌面端依赖
        run: npm ci
        working-directory: webui/desktop
        env:
          ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/

      # 交叉编译 omni 内核（linux amd64/arm64）+ 内置 MCP 插件
      # 内核二进制在本机就是 Linux 原生，不需要交叉；双架构备料名与 win/mac 同套路。
      - name: 编译 omni 内核与 MCP 插件（linux amd64/arm64）
        shell: bash
        run: |
          set -e
          TAG="${GITHUB_REF_NAME:-${{ github.event.inputs.tag }}}"
          LDFLAGS="-s -w -X main.version=${TAG}"
          go run ./build/gen-builtin-skills
          mkdir -p webui/desktop/bin
          for ARCH in x64 arm64; do
            GA=$ARCH; [ "$ARCH" = x64 ] && GA=amd64
            GOOS=linux GOARCH=$GA go build -trimpath -ldflags "$LDFLAGS" -o "webui/desktop/bin/omni-linux-$ARCH" .
            mkdir -p "webui/desktop/bin/mcp-linux-$ARCH"
            for P in pdf xlsx docx pptx csv image media fetch agnes mimo; do
              GOOS=linux GOARCH=$GA go build -trimpath -o "webui/desktop/bin/mcp-linux-$ARCH/$P" "./dev/$P"
            done
          done
          # 正式名放 x64 那份（beforePack 钩子按每轮目标架构无条件重覆盖）
          cp webui/desktop/bin/omni-linux-x64 webui/desktop/bin/omni
          chmod +x webui/desktop/bin/omni webui/desktop/bin/omni-linux-* webui/desktop/bin/mcp-linux-*/*
          ls -l webui/desktop/bin

      # 内置 ffmpeg / ffprobe（media 插件依赖；Electron 的 libffmpeg.so 不能用于转码）
      # 备料落在 bin/ffmpeg/ 子目录；显式校验而非裸 glob（glob 无匹配时报错信息极具误导性）。
      - name: 拉取内置 ffmpeg/ffprobe（linux x64/arm64）
        shell: bash
        run: |
          set -e
          for ARCH in x64 arm64; do
            node webui/desktop/scripts/fetch-ffmpeg.mjs --platform linux --arch "$ARCH"
          done
          for F in webui/desktop/bin/ffmpeg/ffmpeg-linux-* webui/desktop/bin/ffmpeg/ffprobe-linux-*; do
            [ -f "$F" ] || { echo "::error::缺少备料 $F（fetch-ffmpeg 拉取未成功？）"; exit 1; }
            chmod +x "$F"
          done

      # 打包前 schema 校验（理由同 Windows job）。v1.0.12 首次跑这个 job 就是
      # 因为 linux.desktop 写了非法字段而在 electron-builder 起步时炸掉，白跑一轮编译。
      - name: 校验 electron-builder.yml 配置
        run: npm run check:config
        working-directory: webui/desktop

      # AppImage 需要 FUSE 才能挂载运行，ubuntu runner 上没有，
      # 打 AppImage 用 electron-builder 内置的 linuxDeploy/AppImage 工具链，不依赖 FUSE。
      # deb 需要 dpkg（runner 自带）。
      - name: 构建 Linux 安装包（AppImage + deb，x64 + arm64）
        run: npx electron-builder --linux AppImage deb --x64 --arm64 --publish never
        working-directory: webui/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/eb-cache

      # Linux 专属断言（跟 mac 同理，Windows 上测不出来）：
      #   1) 内核必须带 x 位，否则主进程 spawn 会被系统拒绝；
      #   2) 必须是 ELF 且架构匹配（file 输出含 x86-64 / aarch64），
      #      防止「arm64 runner 上打 x64 包却忘换内核」；
      #   3) MCP 插件必须随包且带 x 位。
      # unpacked 目录名规则：x64 → release/linux-unpacked，arm64 → release/linux-arm64-unpacked。
      - name: 校验双架构内核已打进安装包且架构正确
        shell: bash
        run: |
          for ARCH in x64 arm64; do
            if [ "$ARCH" = x64 ]; then APPDIR="webui/desktop/release/linux-unpacked"; else APPDIR="webui/desktop/release/linux-arm64-unpacked"; fi
            if [ ! -d "$APPDIR" ]; then
              echo "::error::未产出 $APPDIR"
              ls -l webui/desktop/release
              exit 1
            fi
            BIN="$APPDIR/resources/bin/omni"
            if [ ! -f "$BIN" ]; then
              echo "::error::[$ARCH] 安装包内缺少内核二进制：$BIN"
              echo "::error::检查 electron-builder.yml 的 extraResources 与 beforePack 钩子"
              exit 1
            fi
            SIZE=$(stat -c%s "$BIN")
            echo "[$ARCH] 内核二进制：$BIN（$SIZE 字节，预期 >10MB）"
            if [ "$SIZE" -lt 10000000 ]; then
              echo "::error::[$ARCH] 只有 $SIZE 字节，疑似未编译产物"
              exit 1
            fi
            KIND=$(file -b "$BIN")
            echo "  类型：$KIND"
            case "$ARCH" in
              x64)   case "$KIND" in *x86-64*)  echo "  ✓ 架构匹配" ;; *) echo "::error::[$ARCH] 包里装的不是 x64 内核（$KIND）——beforePack 钩子未生效"; exit 1 ;; esac ;;
              arm64) case "$KIND" in *aarch64*) echo "  ✓ 架构匹配" ;; *) echo "::error::[$ARCH] 包里装的不是 arm64 内核（$KIND）——beforePack 钩子未生效"; exit 1 ;; esac ;;
            esac
            if [ ! -x "$BIN" ]; then
              echo "::error::[$ARCH] 内核二进制没有可执行权限——Linux 上主进程无法 spawn 它"
              exit 1
            fi
            RESDIR=$(dirname "$BIN")
            for P in pdf xlsx docx pptx csv image media fetch agnes mimo; do
              if [ ! -x "$RESDIR/$P" ]; then
                echo "::error::[$ARCH] 安装包内缺少 MCP 插件（或无 x 位）：$RESDIR/$P"
                exit 1
              fi
            done
            # ffmpeg/ffprobe 必须随包且带 x 位（media 插件依赖，位于 bin/ffmpeg/ 子目录）
            for T in ffmpeg ffprobe; do
              if [ ! -x "$RESDIR/ffmpeg/$T" ]; then
                echo "::error::[$ARCH] 安装包内缺少 ffmpeg/$T（或无 x 位），media 插件将不可用"
                exit 1
              fi
            done
          done
          # AppImage 与 deb 都要产出（AppImage 是主推格式，deb 供 apt）
          #
          # ⚠️ ${arch} 的展开名**按扩展名不同**（builder-util/src/arch.ts 的
          #    getArtifactArchName 里硬编码），别想当然写成 x64：
          #      AppImage → x86_64   deb → amd64   （arm64 两种格式都是 arm64）
          #    v1.0.13 就是这里写错文件名，产物其实叫 omni-Setup-x86_64.AppImage /
          #    omni-Setup-amd64.deb，被 fail_on_unmatched_files 拦下。
          for f in webui/desktop/release/omni-Setup-x86_64.AppImage webui/desktop/release/omni-Setup-arm64.AppImage \
                   webui/desktop/release/omni-Setup-amd64.deb webui/desktop/release/omni-Setup-arm64.deb; do
            if [ ! -f "$f" ]; then
              echo "::error::未找到 $f——检查 electron-builder.yml 的 linux.target 与 artifactName"
              ls -l webui/desktop/release
              exit 1
            fi
          done
          echo "✓ 双架构内核均正常且可执行，AppImage/deb 产物齐全"

      - name: 列出产物
        shell: bash
        run: ls -l webui/desktop/release

      - name: 上传 Linux 安装包到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            webui/desktop/release/omni-Setup-x86_64.AppImage
            webui/desktop/release/omni-Setup-arm64.AppImage
            webui/desktop/release/omni-Setup-amd64.deb
            webui/desktop/release/omni-Setup-arm64.deb
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
