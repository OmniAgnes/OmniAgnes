<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>omni web</title>
<style>
:root { --bg:#1a1525; --panel:#241e33; --border:#3b3350; --text:#eae6f2; --muted:#8b8499;
        --accent:#7c3aed; --accent2:#a78bfa; --user:#f4d03f; --tool:#5eead4; --err:#ff6b6b; }
* { box-sizing: border-box; margin: 0; }
body { background: var(--bg); color: var(--text); font: 14px/1.6 "Segoe UI","Microsoft YaHei",sans-serif;
       height: 100vh; display: flex; flex-direction: column; }
header { background: var(--accent); padding: 6px 14px; display: flex; gap: 10px; align-items: center; }
header .badge { background: var(--bg); padding: 1px 8px; border-radius: 4px; font-size: 12px; }
main { flex: 1; overflow-y: auto; padding: 16px 14px; }
.msg { max-width: 860px; margin: 0 auto 12px; white-space: pre-wrap; word-break: break-word; }
.msg .who { font-weight: 600; }
.user .who { color: var(--user); }
.assistant .who { color: var(--accent2); }
.tool { color: var(--tool); font-size: 13px; margin-top: 6px; margin-left: 12px; }
.tool pre { color: var(--muted); margin: 2px 0 0 14px; white-space: pre-wrap; font-size: 12px;
            max-height: 220px; overflow-y: auto; }
.tool.err, .errtext { color: var(--err); }
.hint { color: var(--muted); font-style: italic; text-align: center; }
footer { border-top: 1px solid var(--border); background: var(--panel); padding: 10px 14px;
         display: flex; gap: 10px; }
#input { flex: 1; background: var(--bg); color: var(--text); border: 1px solid var(--border);
         border-radius: 8px; padding: 8px 10px; resize: none; height: 64px; font: inherit; }
#input:focus { outline: 1px solid var(--accent); }
#send { background: var(--accent); border: 0; color: #fff; border-radius: 8px;
        padding: 0 22px; cursor: pointer; }
#send:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
<header><b>omni</b><span class="badge" id="model">…</span><span class="badge" id="mode"></span></header>
<main id="log"><div class="hint">输入消息开始对话（Enter 发送，Shift+Enter 换行）</div></main>
<footer>
  <textarea id="input" placeholder="输入消息…"></textarea>
  <button id="send">发送</button>
</footer>
<script>
const log = document.getElementById('log');
const input = document.getElementById('input');
const send = document.getElementById('send');
let busy = false;

fetch('/api/state').then(r => r.json()).then(s => {
  document.getElementById('model').textContent = s.configured ? s.model : '未配置';
  document.getElementById('mode').textContent = s.mode;
});

function add(cls, who, text) {
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  const h = document.createElement('div');
  h.className = 'who'; h.textContent = who;
  const b = document.createElement('div');
  if (text) b.textContent = text;
  d.append(h, b);
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
  return d;
}

function addTool(msg, ev) {
  const d = document.createElement('div');
  d.className = 'tool';
  const s = document.createElement('span');
  s.textContent = '▸ ' + ev.name + ' ' + (ev.args || '').slice(0, 200);
  const pre = document.createElement('pre');
  d.append(s, pre);
  msg.appendChild(d);
  return d;
}

async function chat() {
  const text = input.value.trim();
  if (!text || busy) return;
  input.value = '';
  busy = true; send.disabled = true;
  add('user', 'You', text);
  const a = add('assistant', 'omni', '');
  const body = a.firstChild.nextSibling;
  let curTool = null;
  const on = ev => {
    if (ev.type === 'text') body.textContent += ev.text;
    else if (ev.type === 'tool_start') curTool = addTool(a, ev);
    else if (ev.type === 'tool_output' && curTool) {
      curTool.querySelector('pre').textContent = (ev.output || '').slice(0, 2000);
      if (ev.is_error) curTool.classList.add('err');
    } else if (ev.type === 'error') {
      const e = document.createElement('div');
      e.className = 'errtext'; e.textContent = ev.error;
      a.appendChild(e);
    }
  };
  try {
    const resp = await fetch('/api/chat', { method: 'POST',
      headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text }) });
    if (!resp.ok) { body.textContent = await resp.text(); return; }
    const reader = resp.body.getReader(), dec = new TextDecoder();
    let buf = '';
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf('\n\n')) >= 0) {
        const part = buf.slice(0, i); buf = buf.slice(i + 2);
        for (const line of part.split('\n')) {
          if (line.startsWith('data: ')) {
            try { on(JSON.parse(line.slice(6))); } catch (e) {}
          }
        }
        log.scrollTop = log.scrollHeight;
      }
    }
  } catch (e) { body.textContent = '请求失败: ' + e; }
  finally { busy = false; send.disabled = false; input.focus(); log.scrollTop = log.scrollHeight; }
}

send.onclick = chat;
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); chat(); }
});
input.focus();
</script>
</body>
</html>
