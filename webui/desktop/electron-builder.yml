# omni 桌面版打包说明
# - Windows NSIS / macOS dmg + extraResources 携带 omni 内核二进制
# - 版本号唯一来源是 package.json，不要在这里重复声明
# - 发版由 .github/workflows/release.yml 驱动：CI 交叉编译各架构内核放进 bin/，
#   beforePack 钩子按目标架构把对应内核换入 resources/bin（本地单架构打包时钩子自动跳过）
#
# ⚠️ publish: null 是必需的：electron-builder 会从 package.json 的 repository 推断
#    provider=github 并在生成 app-update.yml 时强取 GH_TOKEN 报错，--publish never
#    拦不住该步骤；只有显式 null 才能短路（2026-09-22 实测结论）。
#
# ⚠️ 不要写 extraMetadata: { version: "${version}" }——该字段不展开占位符，
#    会原样写进包内 package.json，最后写 exe 资源版本号时抛 Invalid major number。
publish: null
# Windows 任务栏身份（AUMID）：与 main.js 的 APP_AUMID 一致，安装器生成的
# 快捷方式带此 ID，任务栏右键菜单才能显示 omni 的名字与图标。
appId: com.omni.desktop
directories:
  output: release
files:
  # 主进程源码都在本目录根部（main.js / preload.js / updater.js），用 glob 而不是逐个点名。
  # ⚠️ 历史上这里是逐个列文件，新增 updater.js 时漏登记，装机后 main.js 的
  #    require("./updater") 直接抛 "Cannot find module ./updater"——白名单一旦点名，
  #    每加一个主进程文件都必须同步，改 glob 就没这个坑。
  #    `*.js` 只匹配根这一层，scripts/*.cjs、*.mjs、*.py 不会被带进包。
  - "*.js"
  - package.json
beforePack: scripts/electron-before-pack.cjs
extraResources:
  # omni 内核二进制（主进程打包态从 resources/bin 读取）；
  # 打包前先在仓库根目录执行 go build -o webui/desktop/bin/omni.exe .
  # （CI 上由各架构交叉编译产物填入，见 release.yml）
  # filter 排除交叉架构的备料文件（内核 omni-*、MCP 插件备料目录 mcp-*），
  # 防止把两份内核/插件都打进安装包。
  - from: bin
    to: bin
    filter:
      - "!omni-windows-*"
      - "!omni-darwin-*"
      - "!omni-linux-*"
      - "!mcp-*"
win:
  # 应用图标：build/icon.ico（由 make_icon.py 生成，源图为 build/icon.svg）
  icon: build/icon.ico
  target:
    - nsis
  artifactName: omni-Setup-${arch}.${ext}
mac:
  # 未签名发布（无 Apple Developer 账号）：用户首次打开需右键→打开绕过 Gatekeeper。
  # CI 上只出 dmg、不出 zip（zip 是 electron-updater 的 mac 自动更新格式，本项目不用）。
  # 图标：优先 build/icon.icns（CI 从 icon.png 现场生成，见 release.yml）；
  # 本地 mac 打包没有 icns 时 electron-builder 会自动从 icon.png 转换。
  target:
    - dmg
  artifactName: omni-Setup-${arch}.${ext}
  category: public.app-category.developer-tools
linux:
  # Linux 出两种包：
  #   AppImage —— 单文件、免安装，`chmod +x` 直接跑，是主推格式（分发最省事）
  #   deb     —— 供 apt 或 Ubuntu 软件中心安装
  # ⚠️ Linux 下 extraResources 落在 resources/ 而非 Contents/Resources/，
  #    内核路径仍是 resources/bin/omni（main.js 用 app.resourcesPath 拼，无需区分）。
  # 图标直接用 build/icon.png（Linux 不认 ico；electron-builder 会生成各类尺寸）。
  icon: build/icon.png
  category: Development
  synopsis: omni agent desktop
  target:
    - AppImage
    - deb
  artifactName: omni-Setup-${arch}.${ext}
  # 窗口关联（任务栏图标/名称）靠 StartupWMClass 与 Electron 的 app_id 一致，
  # 而 Electron 的 app_id 取自 package.json 的 desktopName —— 所以正确做法是
  # 在 package.json 里设 desktopName + 这里开 syncDesktopName，让 electron-builder
  # 自己把 .desktop 文件名与 StartupWMClass 同步过去（见 LinuxTargetHelper 的 wmClass 逻辑）。
  #
  # ⚠️ 别再手写 desktop.entry.StartupWMClass：
  #   1) linux.desktop 只接受 desktopActions / entry 两个键
  #      （schema: LinuxDesktopFile.additionalProperties = false），
  #      平铺第三个键会让 electron-builder 起步就抛 "Invalid configuration object"
  #      —— v1.0.12 首次跑 build-linux 就是这么炸的，白跑一轮交叉编译；
  #   2) 即便写进 entry，手填值也可能与 desktopName 不同步导致桌面环境
  #      关联不上窗口（图标名显示为 omni/electron）。
  # 要改桌面分类名请改 package.json 的 productName；要加别的 .desktop 键用 entry 映射。
  syncDesktopName: true
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always

